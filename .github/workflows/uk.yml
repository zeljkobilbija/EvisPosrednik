# Na 10 minuta: zatvaranja na autoputevima Engleske (National Highways, Road and Lane Closures v2.0)
# → uk.json u grani "podaci-uk" (grana se svaki put prepisuje jednim commit-om). Ključ je tajna NH_KEY.
# "Powered by National Highways' Transport Data Feeds"
name: Engleska (National Highways)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uk
  cancel-in-progress: true
jobs:
  uk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preuzmi i sažmi
        env:
          NH_KEY: ${{ secrets.NH_KEY }}
        run: node alati/uk.js izlaz/uk.json
      - name: Objavi u grani podaci-uk
        run: |
          cd izlaz
          git init -q -b podaci-uk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add uk.json
          git commit -q -m "Zatvaranja National Highways – $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" podaci-uk
