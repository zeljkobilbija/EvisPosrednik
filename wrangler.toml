# Cloudflare Worker: posrednik za EVIS.AT (ASFINAG), Englesku (/uk) i Francusku (/fr). Tajne: EVIS_KEY, GH_TOKEN, TIPI_KORISNIK, TIPI_LOZINKA (npx wrangler secret put …)
name = "evis-posrednik"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# promenljive dodate na Cloudflare-u (npr. TIPI_KORISNIK) ne brišu se pri `wrangler deploy`
keep_vars = true

# Tajmer (GitHub-ov cron je nepouzdan): na 10 min Worker pokreće GitHub Action uk.yml, jednom na sat planirano.yml.
# Treba tajna GH_TOKEN (fine-grained, samo repo EvisPosrednik, Actions: read/write): npx wrangler secret put GH_TOKEN
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
